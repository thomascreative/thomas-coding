<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A we just announce the movement ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Georgia, "Times New Roman", serif;
    background:
        radial-gradient(circle at top, #18345f, #070d19 65%);
    color: #f8f1df;
    text-align: center;
    overflow-x: hidden;
}

/* Moving yellow light */
.light {
    position: fixed;
    top: 0;
    left: -100%;
    width: 100%;
    height: 4px;
    background: #00c8ff;
    box-shadow: 0 0 15px #00c8ff, 0 0 35px #00c8ff;
    animation: runningLight 3s linear infinite;
    z-index: 20;
}

@keyframes runninggreen neon disco lights {
    from {
        left: -100%;
    }
    to {
        left: 100%;
    }
}

/* Opening screen */
.welcome {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 30px;
}

.logo {
    font-size: 60px;
    margin-bottom: 15px;
    animation: float 3s ease-in-out infinite;
}

@keyframes float {
    50% {
        transform: translateY(-10px);
    }
}

h1 {
    font-size: clamp(36px, 8vw, 58px);
    margin: 10px 0;
}

.subtitle {
    font-size: 20px;
    color: #d9c58c;
    margin-bottom: 30px;
}

.open-btn,
.unlock-btn,
.replay-btn {
    border: 1px solid #d9c58c;
    background: linear-gradient(135deg, #d9c58c, #9e7b2e);
    color: #111;
    padding: 14px 28px;
    border-radius: 30px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.open-btn:hover,
.unlock-btn:hover,
.replay-btn:hover {
    transform: scale(1.06);
    box-shadow: 0 0 20px rgba(217,197,140,0.5);
}

/* Envelope */
#envelopeArea {
    display: none;
    padding: 30px;
}

.envelope {
    font-size: 100px;
    animation: envelopeFloat 2s ease-in-out infinite;
}

@keyframes envelopeFloat {
    50% {
        transform: translateY(-12px);
    }
}

/* Password */
#passwordArea {
    display: none;
    max-width: 380px;
    margin: 20px auto;
    padding: 25px;
    border: 1px solid rgba(217,197,140,0.5);
    border-radius: 20px;
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(10px);
}

input {
    width: 100%;
    padding: 14px;
    margin: 15px 0;
    border: 1px solid #bda96b;
    border-radius: 10px;
    background: #111a2a;
    color: white;
    font-size: 16px;
    outline: none;
}

#wrong {
    color: #ffaaaa;
}

/* Letter */
#letterArea {
    display: none;
    min-height: 100vh;
    padding: 70px 20px;
}

.letter {
    max-width: 720px;
    margin: auto;
    padding: 40px 30px;
    background:
        linear-gradient(135deg, #fffdf5, #eee4c9);
    color: #302719;
    border-radius: 8px;
    box-shadow:
        0 20px 60px rgba(0,0,0,0.5),
        0 0 30px rgba(217,197,140,0.15);
    text-align: left;
}

.letter h2 {
    text-align: center;
    color: #604b1d;
    font-size: 32px;
}

.line {
    width: 80px;
    height: 2px;
    background: #b89a4b;
    margin: 15px auto 30px;
}

#typedText {
    font-size: 19px;
    line-height: 1.9;
    white-space: pre-line;
}

.signature {
    margin-top: 30px;
    text-align: right;
    font-style: italic;
    font-size: 20px;
    color: #604b1d;
}

.replay {
    text-align: center;
    margin-top: 30px;
}

/* Floating decorations */
.decor {
    position: fixed;
    top: -40px;
    pointer-events: none;
    animation: fall linear forwards;
    z-index: 5;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
    }
}

.footer {
    margin-top: 25px;
    text-align: center;
    color: #d9c58c;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="light"></div>

<!-- Opening -->
<section class="welcome" id="welcome">

    <div class="logo">✉️</div>

    <h1>A Special Letter</h1>

    <div class="subtitle">
        A private message from Thomas ❤️
    </div>

    <button class="open-btn" onclick="showEnvelope()">
        Open the Letter
    </button>

</section>

<!-- Envelope -->
<section id="envelopeArea">

    <div class="envelope">💌</div>

    <h2>This letter is private 🔐</h2>

    <p>Enter the secret password to continue.</p>

    <button class="open-btn" onclick="showPassword()">
        Continue
    </button>

    <div id="passwordArea">

        <input
            type="password"
            id="password"
            placeholder="Enter password"
        >

        <button class="unlock-btn" onclick="unlockLetter()">
            Unlock ❤️
        </button>

        <p id="wrong"></p>

    </div>

</section>

<!-- Letter -->
<section id="letterArea">

    <div class="letter">

        <h2>To Someone Pretty ❤️</h2>

        <div class="line"></div>

        <div id="typedText"></div>

        <div class="signature">
            With love,<br>
            Thomas ❤️
        </div>

    </div>

    <div class="replay">
        <button class="replay-btn" onclick="location.reload()">
            ↻ Replay
        </button>
    </div>

    <div class="footer">
        Made with ❤️ by Thomas
    </div>

</section>

<script>

const letterText =
`Some people enter our lives and make ordinary moments feel a little more beautiful.

Your smile, your kindness, and the way you bring warmth into simple moments make you truly special.

I hope this letter reminds you that you are appreciated, valued, and worthy of beautiful moments every day.

May your days be filled with happiness, laughter, peaceful moments, and countless reasons to smile.

Keep shining, keep being yourself, and never forget that you are special. ❤️`;

function showEnvelope() {

    document.getElementById("welcome").style.display = "none";
    document.getElementById("envelopeArea").style.display = "block";

}

function showPassword() {

    document.getElementById("passwordArea").style.display = "block";

}

function unlockLetter() {

    const password =
        document.getElementById("password").value;

    if (password === "thomaslovesdebby") {

        document.getElementById("envelopeArea").style.display = "none";
        document.getElementById("letterArea").style.display = "block";

        typeLetter();

        startDecorations();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    } else {

        document.getElementById("wrong").textContent =
            "Incorrect password. Please try again.";

    }
}

function typeLetter() {

    const box = document.getElementById("typedText");

    box.textContent = "";

    let i = 0;

    function typing() {

        if (i < letterText.length) {

            box.textContent += letterText.charAt(i);

            i++;

            setTimeout(typing, 25);

        }

    }

    typing();

}

function startDecorations() {

    const symbols = ["❤️", "🌸", "🌹", "✨", "💕"];

    setInterval(() => {

        const item = document.createElement("div");

        item.className = "decor";

        item.textContent =
            symbols[Math.floor(Math.random() * symbols.length)];

        item.style.left =
            Math.random() * 100 + "vw";

        item.style.fontSize =
            (15 + Math.random() * 20) + "px";

        item.style.animationDuration =
            (5 + Math.random() * 5) + "s";

        document.body.appendChild(item);

        setTimeout(() => {
            item.remove();
        }, 10000);

    }, 700);

}

</script>

</body>
</html>
